[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
protobuf = "36.1"

[tasks.build]
description = "Build the SDK"
run = "go build ./..."

[tasks.test]
description = "Run tests"
run = "go test ./... -race -cover"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.gen-protos]
description = "Regenerate Go stubs from the vendored .proto files"
run = "./scripts/gen_protos.sh"

[tasks.check]
description = "Build, test, and lint"
depends = ["build", "test", "lint"]
